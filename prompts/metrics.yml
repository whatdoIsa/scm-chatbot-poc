# 지표 사전. PRD 5.1(기간 해석), 5.2(단위 규칙), 5.3(지표 정의)을 옮긴 것이다.
asOfDate: 2026-11-08
dateRules:
  - expr: 오늘, 현재, 지금
    range: "2026-11-08 (재고는 snap_date = 2026-11-08의 스냅샷)"
  - expr: 어제
    range: "2026-11-07"
  - expr: 최근 N일
    range: "기준일-N+1 ~ 기준일 (예: 최근 7일 = 2026-11-02 ~ 2026-11-08)"
  - expr: 이번 주
    range: "2026-11-02 ~ 2026-11-08"
  - expr: 지난주
    range: "기준일이 속한 주의 직전 주: 2026-10-26 ~ 2026-11-01"
  - expr: 이번 달
    range: "2026-11-01 ~ 2026-11-08"
  - expr: 지난달
    range: "2026-10-01 ~ 2026-10-31"
  - expr: 최근 13주
    range: "forecast_weekly.week_start 2026-08-10 ~ 2026-11-02 전체"
  - expr: 데이터 범위 밖 기간
    range: "refuse (데이터는 2026-08-10 ~ 2026-11-08만 존재)"
unitRules:
  - "품목, SKU로 묻거나 단위를 말하지 않으면 SKU 단위(전 거점 합산)로 집계한다."
  - "SKU-거점, 거점별로 묻거나 특정 거점을 말하면 SKU x 거점 단위로 집계한다."
  - "SKU 표기는 SKU-007 형식이다. SKU-7은 SKU-007로 정규화한다."
terms:
  - words: [재고, 현재고]
    maps: "inventory_daily.on_hand (snap_date = 기준일)"
  - words: [입고 예정, 입고예정]
    maps: "inventory_daily.in_transit (snap_date = 기준일)"
  - words: [판매량, 출고량, 판매, 출고]
    maps: "sales_daily.qty"
  - words: [거점, 센터, 창고]
    maps: "location. 거점 이름은 location.name으로 찾고 location_id로 조인한다 (예: name = '서울센터')"
  - words: [권역, 지역]
    maps: "location.region"
  - words: [품목, SKU]
    maps: "product.sku"
  - words: [카테고리]
    maps: "product.category"
  - words: [ABC, 등급]
    maps: "product.abc_class"
  - words: [안전재고]
    maps: "supply_policy.safety_stock"
  - words: [재주문점]
    maps: "supply_policy.reorder_point"
  - words: [리드타임]
    maps: "supply_policy.lead_time_days"
  - words: [예측]
    maps: "forecast_weekly.forecast_qty (week_start는 그 주의 월요일)"
metrics:
  - name: 일평균 판매량(최근 N일)
    keywords: [일평균, 평균 판매]
    definition: "대상 범위의 최근 N일 qty 합 / N. AVG(qty)를 쓰지 않는다."
    tables: [sales_daily]
  - name: 재고보유일수
    keywords: [재고보유일수, 보유일수]
    definition: "기준일 on_hand / (최근 28일 qty 합 / 28). 분모가 0이면 NULL로 두고 순위와 집계에서 제외한다. SKU 단위는 분자와 분모 모두 거점 합산."
    tables: [inventory_daily, sales_daily]
  - name: 결품률
    keywords: [결품률, 결품]
    definition: "기간 내 on_hand = 0인 (SKU, 거점, 일) 수 / 기간 내 전체 (SKU, 거점, 일) 수. 기간을 말하지 않으면 전체 데이터 기간."
    tables: [inventory_daily]
  - name: 안전재고 미달
    keywords: [안전재고]
    definition: "기준일 on_hand < safety_stock"
    tables: [inventory_daily, supply_policy]
  - name: 재주문 필요
    keywords: [재주문]
    definition: "기준일 on_hand + in_transit <= reorder_point"
    tables: [inventory_daily, supply_policy]
  - name: 예측 정확도
    keywords: [예측 정확도, 정확도, WMAPE]
    definition: "1 - WMAPE. WMAPE = SUM(ABS(실적 - 예측)) / SUM(실적). 실적은 week_start ~ week_start + 6일의 qty 합. 기본 집계 단위는 SKU(전 거점, 13주)."
    tables: [forecast_weekly, sales_daily]
