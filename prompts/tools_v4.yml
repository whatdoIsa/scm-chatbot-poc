# v4 조회 도구 목록(PRD 11장, API_SPEC 9.2). 라우터 프롬프트 v4_router.txt의 {{TOOLS}}로 렌더링된다.
# 이름과 outputs는 ToolName과 같아야 하며, 다르면 ToolCatalog가 읽을 때 실패한다.
# not_for는 이 도구가 답하지 않는 질문이다. 그런 질문은 sql 경로가 맡는다.
tools:
  - name: avg_daily_sales
    metric: 일평균 판매량(최근 N일)
    description: "sum of qty over the last N days ending on the as-of date / N (days = N). 판매량, 출고량 and 판매 mean the same quantity."
    args: [sku, location, region, category, abc_class, days]
    outputs: [value, ranking]
    not_for:
      - "a total or sum of sales (합계, 총 판매량, 누계) - that is not an average"
      - "a daily average over a calendar period such as 9월, 이번 주, 지난주, 이번 달, 지난달 or two given dates"
      - "sales on one day, per day or per week, or a sales trend"
      - "the average of sales_daily rows (AVG(qty)) or the average per SKU-location"
  - name: days_of_supply
    metric: 재고보유일수 (DOS, 재고일수)
    description: "on_hand on the as-of date / (sum of qty over the last 28 days / 28)."
    args: [sku, location, region, category, abc_class]
    outputs: [value, ranking]
    not_for:
      - "the stock quantity itself (재고, 현재고, on_hand) or in_transit (입고 예정)"
      - "a comparison of days of supply with another value such as lead time, or a threshold such as 7일 미만"
  - name: stockout_rate
    metric: 결품률
    description: "(SKU, location, day) rows with on_hand = 0 / all (SKU, location, day) rows in the period. Leave start_date and end_date empty for the whole data period."
    args: [sku, location, region, category, abc_class, start_date, end_date]
    outputs: [value, ranking]
    not_for:
      - "which items or SKU-locations are out of stock now (재고가 0, 품절, 결품 중인 품목)"
      - "how many SKU-locations or days had a stockout (결품이 있었던 횟수, 일수, 개수)"
      - "items with no sales (판매가 없는 품목)"
      - "a ranking of locations, regions or categories (결품률이 가장 높은 거점)"
  - name: forecast_accuracy
    metric: 예측 정확도 (1 - WMAPE)
    description: "1 - sum(|forecast - actual|) / sum(actual) over all 13 weeks."
    args: [sku, location, region, category, abc_class]
    outputs: [value, ranking]
    not_for:
      - "forecast quantities (예측 수량, 예측 합계) or actual sales"
      - "the error of one week, the week with the largest error, or a comparison of forecast with actual (과대 예측, 과소 예측)"
      - "WMAPE or error rate itself when it is asked as an error, not as accuracy"
  - name: below_safety_stock
    metric: 안전재고 미달
    description: "SKU-locations whose on_hand on the as-of date is below safety_stock."
    args: [sku, location, region, category, abc_class]
    outputs: [list, count]
    not_for:
      - "the safety_stock value itself (안전재고가 얼마야, 안전재고 수준)"
      - "items with zero stock (재고가 0, 재고가 바닥난, 품절, 결품, 재고 없음)"
      - "a second condition such as 입고 예정이 없는, 리드타임이 N일인 or 재주문점 이하인 (... 이면서)"
  - name: reorder_needed
    metric: 재주문 필요
    description: "SKU-locations whose on_hand + in_transit on the as-of date is at or below reorder_point."
    args: [sku, location, region, category, abc_class]
    outputs: [list, count]
    not_for:
      - "the reorder_point value itself (재주문점 알려줘, 재주문점이 얼마야, 발주점은?)"
      - "lead time, safety stock or order quantity values"
